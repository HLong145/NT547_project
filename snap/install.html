<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cài Address Misuse Guard</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 560px; margin: 40px auto; padding: 0 16px; line-height: 1.5; }
  button { font-size: 16px; padding: 8px 16px; cursor: pointer; }
  pre { background: #f4f4f4; padding: 8px; white-space: pre-wrap; }
</style>
</head>
<body>
<h1>Address Misuse Guard (Snap)</h1>
<ol>
  <li>Chạy Risk Engine: <code>python -X utf8 -m address_misuse.wallet.api</code> (cổng 8711).</li>
  <li>Dùng MetaMask Flask (bản cho nhà phát triển) để cài Snap cục bộ.</li>
  <li>Bấm nút dưới đây, đồng ý quyền "transaction insight" và "network access".</li>
</ol>
<button id="install">Cài Snap</button>
<pre id="out"></pre>
<script>
  const SNAP_ID = 'local:' + window.location.origin;
  const out = document.getElementById('out');
  document.getElementById('install').onclick = async () => {
    if (!window.ethereum) { out.textContent = 'Không thấy MetaMask Flask.'; return; }
    try {
      const r = await window.ethereum.request({ method: 'wallet_requestSnaps', params: { [SNAP_ID]: {} } });
      out.textContent = 'Đã cài: ' + JSON.stringify(r, null, 2);
    } catch (e) { out.textContent = 'Lỗi: ' + (e && e.message ? e.message : e); }
  };
</script>
</body>
</html>
